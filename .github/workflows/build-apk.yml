name: build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache React Native dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-rn-${{ hashFiles('package-lock.json', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-rn-

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Replace Gradle Repositories with Aliyun Mirrors
        run: |
          # 备份原始文件
          cp android/build.gradle android/build.gradle.bak
          cp android/settings.gradle android/settings.gradle.bak

          # 替换 settings.gradle 里的 pluginManagement.repositories
          python3 - << 'PYEOF'
          import re

          def replace_repos(text):
              text = text.replace("google()", "maven { url 'https://maven.aliyun.com/repository/google' }")
              text = text.replace("mavenCentral()", "maven { url 'https://maven.aliyun.com/repository/public' }")
              text = text.replace("gradlePluginPortal()", "maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }")
              return text

          for path in ["android/build.gradle", "android/settings.gradle"]:
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = replace_repos(content)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"✅ 已替换 {path} 的仓库地址")
          PYEOF

          # 打印替换后的关键片段，方便排查
          echo "=== android/settings.gradle ==="
          cat android/settings.gradle
          echo ""
          echo "=== android/build.gradle ==="
          cat android/build.gradle

      - name: Setup Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cat > android/keystore.properties << 'EOF'
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          EOF
          chmod 600 android/keystore.properties android/app/release.keystore

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --parallel --build-cache --configure-on-demand

      - name: List generated APKs
        run: |
          echo "📱 Generated APK files:"
          find android/app/build/outputs/apk/release -name "*.apk" -exec ls -lh {} \;

      - name: Restore original Gradle files
        if: always()
        run: |
          mv android/build.gradle.bak android/build.gradle
          mv android/settings.gradle.bak android/settings.gradle

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json
        if: success()
        run: |
          TAG="v${{ github.run_number }}"
          APP_VERSION=$(node -p "require('./package.json').version")

          mkdir -p release
          cat > release/version.json << EOF
          {
            "version": "${APP_VERSION}",
            "changeLog": [
              "【新增】订阅同步功能，支持自动同步在线订阅的新增、修改、删除",
              "【优化】App 内下载升级，不再跳浏览器，多源自动切换"
            ],
            "download": [
              "https://gh.monlor.com/https://github.com/dyr1980/liu269569205MusicFree/releases/download/${TAG}/app-arm64-v8a-release.apk",
              "https://github.chenc.dev/https://github.com/dyr1980/liu269569205MusicFree/releases/download/${TAG}/app-arm64-v8a-release.apk",
              "https://gh.acmsz.top/https://github.com/dyr1980/liu269569205MusicFree/releases/download/${TAG}/app-arm64-v8a-release.apk",
              "https://ghfast.top/https://github.com/dyr1980/liu269569205MusicFree/releases/download/${TAG}/app-arm64-v8a-release.apk",
              "https://github.com/dyr1980/liu269569205MusicFree/releases/download/${TAG}/app-arm64-v8a-release.apk"
            ]
          }
          EOF

          echo "✅ Generated version.json:"
          cat release/version.json

      - name: Commit version.json
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/version.json
          git commit -m "chore: auto-update version.json for v${{ github.run_number }}" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
